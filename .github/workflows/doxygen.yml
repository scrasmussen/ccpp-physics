name: Doxygen GitHub Pages Deploy Action

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.repository == 'NCAR/ccpp-physics' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

    - name: Install Doxygen + Graphviz + LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz perl texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

    - name: Show documentation tool versions
      run: |
        doxygen --version
        dot -V

    - name: Checkout current ccpp-physics code
      uses: actions/checkout@v6

    - name: Build GitHub Pages site
      run: |
        make -C tools/doxygen build \
          NCAR_PHYSICS_REF=main \
          V7_PHYSICS_REF=v7.0.1 \
          UFS_PHYSICS_REF=release/srw-v3

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: tools/doxygen/.build/doxygen/site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
